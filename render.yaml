version: "1"

services:
  # ==========================================================
  # Основное веб-приложение (статический SPA)
  # ==========================================================
  - name: tradeumdiary-web
    type: static
    region: frankfurt
    buildCommand: npm ci --production=false && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      - type: header
        source: /assets/*
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_SUPABASE_URL
        value: "https://zfgeofskmgycojbzrznk.supabase.co"
      - key: VITE_SUPABASE_ANON_KEY
        value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmZ2VvZnNrbWd5Y29qYnpyem5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDAyOTEsImV4cCI6MjA5MjI3NjI5MX0.D8TJb9Wn-b_RpxG7I4MluTuBxoP68YheoqMu_Dlu8xo"
      - key: NODE_ENV
        value: "production"

  # ==========================================================
  # Cron: обработка очереди кошельков (каждые 5 минут)
  # ==========================================================
  - name: tradeumdiary-cron-wallets
    type: cron
    runtime: node
    region: frankfurt
    schedule: "*/5 * * * *"
    buildCommand: npm ci --production=false
    startCommand: |
      #!/bin/bash
      set -e
      curl -s -X POST "${SUPABASE_URL}/functions/v1/fetch-trade-history" \
        -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
        -H "Content-Type: application/json" \
        -d '{"action":"process_queue"}' && echo "✅ OK" || (echo "❌ FAILED" && exit 1)
    envVars:
      - key: SUPABASE_URL
        value: "https://zfgeofskmgycojbzrznk.supabase.co"
      - key: SUPABASE_ANON_KEY
        value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmZ2VvZnNrbWd5Y29qYnpyem5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDAyOTEsImV4cCI6MjA5MjI3NjI5MX0.D8TJb9Wn-b_RpxG7I4MluTuBxoP68YheoqMu_Dlu8xo"

  # ==========================================================
  # Cron: дневная аналитика (каждый день в 2:00 UTC)
  # ==========================================================
  - name: tradeumdiary-cron-analytics
    type: cron
    runtime: node
    region: frankfurt
    schedule: "0 2 * * *"
    buildCommand: npm ci --production=false
    startCommand: |
      #!/bin/bash
      set -e
      curl -s -X POST "${SUPABASE_URL}/functions/v1/calculate-analytics" \
        -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
        -H "Content-Type: application/json" && echo "✅ OK" || (echo "❌ FAILED" && exit 1)
    envVars:
      - key: SUPABASE_URL
        value: "https://zfgeofskmgycojbzrznk.supabase.co"
      - key: SUPABASE_ANON_KEY
        value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmZ2VvZnNrbWd5Y29qYnpyem5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MDAyOTEsImV4cCI6MjA5MjI3NjI5MX0.D8TJb9Wn-b_RpxG7I4MluTuBxoP68YheoqMu_Dlu8xo"

  # ==========================================================
  # Cron: очистка истекших PRO-подписок (каждый час)
  # ==========================================================
  - name: tradeumdiary-cron-subscriptions
    type: cron
    runtime: node
    region: frankfurt
    schedule: "0 * * * *"
    buildCommand: npm ci --production=false
    startCommand: |
      #!/bin/bash
      set -e
      curl -s -X POST "${SUPABASE_URL}/rest/v1/rpc/expire_pro_subscriptions" \
        -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
        -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
        -H "Content-Type: application/json" && echo "✅ OK" || (echo "❌ FAILED" && exit 1)
    envVars:
      - key: SUPABASE_URL
        value: "https://zfgeofskmgycojbzrznk.supabase.co"
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmZ2VvZnNrbWd5Y29qYnpyem5rIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3NjcwMDI5MSwiZXhwIjoyMDkyMjc2MjkxfQ.XXRtRsaWLV4hvXjVOgeQV4PjFUHfBuv1E88gU1gWa-A"