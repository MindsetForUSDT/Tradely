# ============================================================
# TradeumDiary — Конфигурация деплоя на Render
# ============================================================

version: "1"

services:
  # Основное веб-приложение
  - name: tradeumdiary-web
    type: web
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l $PORT --single
    healthCheckPath: /
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: NODE_VERSION
        value: "20"
    autoDeploy: true
    scaling:
      minInstances: 1
      maxInstances: 3

  # Cron: обработка очереди кошельков (каждые 5 минут)
  - name: tradeumdiary-cron-wallets
    type: cron
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: |
      curl -X POST https://tradely.onrender.com/api/cron/process-wallets \
        -H "Authorization: Bearer $CRON_SECRET" \
        -H "Content-Type: application/json"
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Cron: дневная аналитика (каждый день в 2:00 UTC)
  - name: tradeumdiary-cron-analytics
    type: cron
    runtime: node
    region: frankfurt
    plan: starter
    schedule: "0 2 * * *"
    buildCommand: npm install
    startCommand: |
      curl -X POST https://tradely.onrender.com/api/cron/calculate-analytics \
        -H "Authorization: Bearer $CRON_SECRET"
    envVars:
      - key: CRON_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false