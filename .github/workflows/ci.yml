name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Keep lint errors blocking while the legacy warning backlog is reduced.
        run: npx eslint src --ext .ts,.tsx

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run --passWithNoTests

      - name: Build
        run: npm run build
