services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradeumdiary
      POSTGRES_USER: tradeumdiary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - tradeumdiary_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeumdiary -d tradeumdiary"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://tradeumdiary:${POSTGRES_PASSWORD}@db:5432/tradeumdiary
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Copy .env.example to .env and set ENCRYPTION_KEY}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  tradeumdiary_postgres:
